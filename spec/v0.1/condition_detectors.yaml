schema_version: ack.condition_detectors.v0.1
status: DESIGN_SPEC

contract:
  adapters_supply_observations_only: true
  core_classifies_conditions: true
  every_condition_requires_evidence: true
  provider_specific_policy_decisions_forbidden: true

conditions:
  A_STALE_DERIVED_VIEW:
    detector: detect_stale_derived_view
    required_inputs: [authoritative_source_revisions, derived_view_source_revisions]
    evidence_fields: [authoritative_revision, derived_revision, source_locator]
  A_STALE_COPIED_METADATA:
    detector: detect_stale_copied_metadata
    required_inputs: [active_authority_value, copied_metadata_value, declared_precedence_rule]
    evidence_fields: [active_source, copied_source, active_value, copied_value]
  A_OPTIONAL_TELEMETRY_MISSING:
    detector: detect_optional_telemetry_missing
    required_inputs: [telemetry_requirement_spec, runtime_observations]
    evidence_fields: [missing_optional_fields, observation_source]
  A_SCHEDULER_DEGRADED_NO_SIDE_EFFECT:
    detector: detect_scheduler_degraded_no_side_effect
    required_inputs: [scheduler_observation, start_receipts, claims, task_events, checkpoints, artifacts]
    predicates:
      scheduler_attempt_observed: true
      start_receipt_absent: true
      claim_absent: true
      content_event_absent: true
      checkpoint_absent: true
      artifact_absent: true
  A_HISTORICAL_POLICY_TEXT_PRESENT:
    detector: detect_historical_policy_text_present
    required_inputs: [active_policy_revision, supersession_metadata, observed_policy_documents]
    predicates:
      active_rule_uniquely_resolved: true
      superseded_text_present: true
  A_NONCRITICAL_REFERENCE_UNAVAILABLE:
    detector: detect_noncritical_reference_unavailable
    required_inputs: [reference_requirements, retrieval_observations, requested_operation]
    predicates:
      reference_required_for_operation: false
      reference_authority_class: [EVIDENCE, OPTIONAL_REFERENCE]

  R_AUTHORITY_CONFLICT:
    detector: detect_authority_conflict
    required_inputs: [domain_authority_candidates, precedence_rules]
    predicates:
      top_rank_authorities_conflict: true
      declared_reconciliation_rule_absent: true
  R_POLICY_INCOMPATIBLE:
    detector: detect_policy_incompatible
    required_inputs: [active_policy_epoch, project_binding, compatibility_rule]
    predicates:
      compatibility_verdict: INCOMPATIBLE
  R_POLICY_FINGERPRINT_MISMATCH:
    detector: detect_policy_fingerprint_mismatch
    required_inputs: [expected_monitored_revisions, observed_monitored_revisions]
    predicates:
      any_required_revision_mismatch: true
  R_ARTIFACT_IDENTITY_MISMATCH:
    detector: detect_artifact_identity_mismatch
    required_inputs: [expected_artifact_identity, observed_artifact_identity]
    predicates:
      identity_comparison: MISMATCH
  R_REQUIRED_ARTIFACT_UNAVAILABLE:
    detector: detect_required_artifact_unavailable
    required_inputs: [operation_gate, authoritative_artifact_locator, retrieval_observation]
    predicates:
      exact_artifact_required: true
      independent_retrieval_verified: false
  R_CLAIM_CONFLICT:
    detector: detect_claim_conflict
    required_inputs: [active_claims, proposed_claim, idempotency_record]
    predicates:
      incompatible_active_claim_exists: true
  R_STALE_EXPECTED_REVISION:
    detector: detect_stale_expected_revision
    required_inputs: [requested_expected_revision, observed_current_revision]
    predicates:
      exact_match: false
  R_ILLEGAL_TRANSITION:
    detector: detect_illegal_transition
    required_inputs: [state_machine_spec, current_normalized_state, requested_transition]
    predicates:
      declared_edge_exists: false
  R_MISSING_AUTHORIZATION:
    detector: detect_missing_authorization
    required_inputs: [operation_class, required_authorization_flags, effective_state]
    predicates:
      required_flag_missing_or_false: true
  R_ROLE_WRITE_VIOLATION:
    detector: detect_role_write_violation
    required_inputs: [single_writer_map, actor_role, target_state_class, delegation_records]
    predicates:
      owner_or_delegation_match: false
  R_REQUIRED_GATE_MISSING:
    detector: detect_required_gate_missing
    required_inputs: [operation_class, gate_spec, available_evidence]
    predicates:
      any_required_gate_unsatisfied: true

semantic_conditions:
  S_AUTHORITY_MEANING_AMBIGUOUS:
    detector: detect_authority_meaning_ambiguity
    required_inputs: [same_rank_textual_authorities, declared_precedence_rules]
    trigger_when: ranking_requires_interpretation_of_intended_meaning
    result: SEMANTIC_REVIEW_REQUIRED
  S_SCOPE_CHANGE_AMBIGUOUS:
    detector: detect_scope_change_ambiguity
    required_inputs: [requested_change, current_scope_contract]
    trigger_when: material_rescope_cannot_be_determined_from_machine_fields
    result: SEMANTIC_REVIEW_REQUIRED
  S_REQUIREMENT_CONFLICT:
    detector: detect_requirement_conflict_boundary
    required_inputs: [requirements, precedence_rules]
    trigger_when: apparent_conflict_requires_semantic_interpretation
    result: SEMANTIC_REVIEW_REQUIRED
  S_ACCEPTANCE_JUDGMENT_REQUIRED:
    detector: detect_acceptance_judgment_boundary
    required_inputs: [acceptance_request, mechanical_gate_results]
    trigger_when: adequacy_correctness_or_value_judgment_is_intentionally_nonmechanical
    result: SEMANTIC_REVIEW_REQUIRED

output_contract:
  condition_code: string
  condition_class: AMBER | RED | SEMANTIC
  detector_id: string
  observed: boolean
  evidence: [SourceRef]
  predicate_results: object
  explanation: string
  semantic_review_required: boolean
