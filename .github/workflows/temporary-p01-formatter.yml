name: Temporary P01 formatter

on:
  push:
    branches: ["impl/ack-impl-p01"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.11.13
      - run: ruff format src tests
      - name: Commit formatted implementation files
        run: |
          if git diff --quiet -- src tests; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Apply Ruff formatting for P01 gates"
          git push origin HEAD:$GITHUB_REF_NAME
