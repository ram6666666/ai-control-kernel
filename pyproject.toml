[build-system]
requires = ["setuptools>=68,<76", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-control-kernel"
version = "0.1.0"
description = "Pure deterministic AI Control Kernel v0.1 core"
readme = "README_IMPLEMENTATION.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jsonschema>=4.18,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "build>=1,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 2000
target-version = "py312"

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

